name: CI

# Build and test on pull requests and on branches other than main. Releases are
# handled separately by release.yml.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NotepadX.slnx

      - name: Build
        run: dotnet build NotepadX.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/NotepadX.Tests/NotepadX.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish check
        shell: pwsh
        run: ./build.ps1 -Arch x64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NotepadX-win-x64
          path: dist/x64/NotepadX.exe
          retention-days: 7

